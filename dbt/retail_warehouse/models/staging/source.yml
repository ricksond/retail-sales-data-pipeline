version: 2

sources:
  - name: bronze
    description: "Raw data loaded into the Bronze layer."

    database: retail_warehouse
    schema: bronze

    tables:
      - name: sales_raw
        description: "Raw Walmart weekly sales data loaded from the source CSV."

        columns:
          - name: store
            description: "Unique store identifier."

          - name: date
            description: "Week associated with the sales record."

          - name: weekly_sales
            description: "Weekly sales amount."

          - name: holiday_flag
            description: "Indicates whether the week is a holiday week."

          - name: temperature
            description: "Temperature during the week."

          - name: fuel_price
            description: "Fuel price during the week."

          - name: cpi
            description: "Consumer Price Index."

          - name: unemployment
            description: "Unemployment rate."

  - name: ml_predictions
    description: "ML prediction results generated by the Python prediction pipeline."

    database: retail_warehouse
    schema: public

    tables:
      - name: ml_predictions_staging
        description: "Staging table containing weekly sales predictions generated by the trained machine learning model."

        columns:
          - name: store_id
            description: "Unique store identifier."

          - name: sales_date
            description: "Week associated with the sales prediction."

          - name: weekly_sales
            description: "Actual weekly sales amount."

          - name: predicted_weekly_sales
            description: "Weekly sales amount predicted by the machine learning model."

          - name: prediction_error
            description: "Difference between actual and predicted weekly sales."

          - name: absolute_error
            description: "Absolute difference between actual and predicted weekly sales."

          - name: model_version
            description: "Version identifier for the machine learning model used to generate the prediction."

          - name: prediction_timestamp
            description: "Timestamp when the prediction was loaded into the data warehouse."