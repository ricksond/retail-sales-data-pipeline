version: 2

models:
  - name: stg_weekly_sales
    description: >
      Cleaned and standardized weekly Walmart sales data
      derived from the Bronze sales_raw source.

    columns:

      - name: store_id
        description: "Unique store identifier."
        data_tests:
          - not_null

      - name: sales_date
        description: "Date representing the sales week."
        data_tests:
          - not_null

      - name: weekly_sales
        description: "Weekly sales amount."
        data_tests:
          - not_null

      - name: holiday_flag
        description: "Indicates whether the week is a holiday week."
        data_tests:
          - not_null

      - name: temperature
        description: "Temperature during the week."
        data_tests:
          - not_null

      - name: fuel_price
        description: "Fuel price during the week."
        data_tests:
          - not_null

      - name: cpi
        description: "Consumer Price Index."
        data_tests:
          - not_null

      - name: unemployment
        description: "Unemployment rate."
        data_tests:
          - not_null